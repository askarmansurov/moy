<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Каталог мастеров (Local)</title>
  <style>
    body { font-family: Verdana, sans-serif; padding: 20px; max-width: 800px; margin: auto; }
    h1 { text-align: center; }
    .product { border: 1px solid #ccc; border-radius: 8px; padding: 15px; margin: 15px 0; }
    .product h3 { margin: 0 0 10px; }
    button { margin-top: 8px; padding: 8px 14px; cursor: pointer; }
    .msg { text-align: center; margin-top: 20px; font-weight: bold; }
  </style>
</head>
<body>

<h1>Каталог мастеров</h1>
<div id="products"></div>

<script>
const categories = ["Электрика", "Сантехника", "Сварка", "Отделка"];

document.addEventListener("DOMContentLoaded", () => {
  let siteData = JSON.parse(localStorage.getItem('siteData')) || {
    masters: [],
    current_master_id: null,
    requests: [],
    myRequestIds: [],
    paidSubscriptions: {},
    singlePayments: []
  };

  const container = document.getElementById('products');
  let hasAny = false;

  siteData.masters.forEach(master => {
    if (!master.subscriptions) return;

    // Определим какие категории оплачены
    let validSubs = categories.filter(cat => 
      master.subscriptions[cat] && new Date(master.subscriptions[cat]) > new Date()
    );

    if (validSubs.length === 0) return; // если нет активных подписок, не показываем мастера

    hasAny = true;

    let div = document.createElement('div');
    div.className = 'product';
    div.innerHTML = `
      <h3>${master.name}</h3>
      <p>Телефон: ${master.phone}<br>Email: ${master.email}</p>
      <p><strong>Категории услуг:</strong> ${validSubs.join(', ')}</p>
    `;

    container.appendChild(div);
  });

  if (!hasAny) {
    container.innerHTML = "<p class='msg'>Нет мастеров с активными подписками. Как только мастера оплатят категории, они появятся здесь.</p>";
  }

  localStorage.setItem('siteData', JSON.stringify(siteData));
});
</script>

</body>
</html>
