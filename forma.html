<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Оставить заявку (Local)</title>
  <style>
    body { font-family: Verdana, sans-serif; padding: 20px; max-width: 600px; margin: auto; }
    h1 { text-align: center; }
    form { border: 1px solid #ccc; padding: 20px; border-radius: 8px; }
    input, select, textarea { display: block; width: 100%; margin-bottom: 15px; padding: 10px; font-size: 16px; }
    button { padding: 10px 20px; cursor: pointer; font-size: 16px; }
    .notif { display: none; position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
             background: #222; color: #fff; padding: 14px 22px; border-radius: 8px;
             box-shadow: 0 0 10px rgba(0,0,0,0.5); font-family: Verdana, sans-serif;
             font-size: 16px; z-index: 1002; }
  </style>
</head>
<body>

<h1>Оставить заявку</h1>

<form id="requestForm">
  <input type="text" placeholder="Ваше имя" required>
  <input type="tel" placeholder="Телефон +7" required>
  <input type="text" placeholder="Город" required>
  <select required>
    <option value="">Выберите категорию</option>
    <option value="Электрика">Электрика</option>
    <option value="Сантехника">Сантехника</option>
    <option value="Сварка">Сварка</option>
    <option value="Отделка">Отделка</option>
  </select>
  <textarea placeholder="Опишите задачу..." required></textarea>
  <button type="submit">Отправить заявку</button>
</form>

<div class="notif" id="notif">✅ Заявка отправлена!</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const form = document.getElementById("requestForm");
  const notif = document.getElementById("notif");

  form.addEventListener("submit", e => {
    e.preventDefault();
    const inputs = form.querySelectorAll("input, select, textarea");

    const name = inputs[0].value.trim();
    const phone = inputs[1].value.trim();
    const city = inputs[2].value.trim();
    const category = inputs[3].value;
    const description = inputs[4].value.trim();

    if (!name || !phone || !city || !category || !description) {
      alert("Пожалуйста, заполните все поля.");
      return;
    }

    let siteData = JSON.parse(localStorage.getItem('siteData')) || {
      masters: [],
      current_master_id: null,
      requests: [],
      myRequestIds: [],
      paidSubscriptions: {},
      singlePayments: []
    };

    const ownerMasterId = siteData.current_master_id || null;

    const newRequest = {
      id: Date.now(),
      name, phone, city, category, description,
      date: new Date().toISOString(),
      owner_master_id: ownerMasterId
    };

    siteData.requests.push(newRequest);

    // Сохраним id заявки для этого клиента, чтобы потом можно было выделить его заявки
    let myRequestIds = JSON.parse(localStorage.getItem('myRequestIds') || '[]');
    myRequestIds.push(newRequest.id);
    localStorage.setItem('myRequestIds', JSON.stringify(myRequestIds));

    localStorage.setItem('siteData', JSON.stringify(siteData));

    form.reset();
    showNotif("✅ Заявка отправлена!");
  });

  function showNotif(message) {
    notif.textContent = message;
    notif.style.display = "block";
    setTimeout(() => { notif.style.display = "none"; }, 4000);
  }
});
</script>

</body>
</html>
