  <header>
    <nav class="nav">
      <img src="111.png" alt="Логотип" class="logo">
      <a href="index.html">Главная</a>

    <h1>Категории услуг</h1>

    <div class="controls">
      <input type="text" id="search" placeholder="Поиск по услугам...">
      <button onclick="startVoiceSearch()">🎤</button>

    <div class="products">
      <div class="product item" onclick="location.href='forma.html'">
        <h3>🔌 Электрика</h3>
        <p>Розетки, автоматы, свет, коротыши</p>
      </div>

        <p>Трубы, краны, унитазы</p>
      </div>
      <div class="product item" onclick="location.href='forma.html'">
        <h3>🔥 Сварка</h3>
        <p>Заборы, ворота, калитки</p>
      </div>
      <div class="product item" onclick="location.href='forma.html'">
        <h3>🖌 Отделка</h3>
        <p>Шпаклёвка, плитка, обои</p>
      </div>
    </div>

  <script src="script.js"></script>
